name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build modpack with Packwiz
        run: |
          wget https://nightly.link/packwiz/packwiz/workflows/go/main/Linux%2064-bit%20x86.zip
          unzip Linux\ 64-bit\ x86.zip
          rm Linux\ 64-bit\ x86.zip
          chmod +x packwiz
          ./packwiz modrinth export -o AMinecraftModpack.mrpack
          ./packwiz curseforge export -o AMinecraftModpack.zip

      - name: Upload Modrinth modpack
        uses: actions/upload-artifact@v4
        with:
          name: modrinth
          path: AMinecraftModpack.mrpack

      - name: Upload Curseforge modpack
        uses: actions/upload-artifact@v4
        with:
          name: curseforge
          path: AMinecraftModpack.zip
